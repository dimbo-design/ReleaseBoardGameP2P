# Which licence covers which file.
#
# The source code is AGPL-3.0-or-later. The game itself — its art, the text on
# its cards and its rules — is CC BY-NC-SA 4.0, so the game cannot be used
# commercially outside the code. The brand is not licensed beyond unmodified
# copies of this project (see TRADEMARKS.md).
#
# Format: REUSE specification 3.3 (https://reuse.software/spec-3.3/). When
# several tables match one file, only the last of them applies — so the default
# comes first and the exceptions follow it.
version = 1

# Everything not claimed by a table below: the source code.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Dmitry Togulev"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The game: card art, card texts, rules text, and the rules owner's answers the
# rules spec is built on.
#
# TODO: the answers still in docs/specs/ (`*-rules-decisions.md`) move to
# docs/rules/decisions/, where the folder alone covers them. They wait for #134,
# which adds one more of them and links to the other.
[[annotations]]
path = [
  "apps/ui/src/assets/cards/**",
  "apps/ui/src/cards/content.ts",
  "packages/translation/src/locales/*/rules.json",
  "docs/rules/**",
  "docs/specs/*-rules-decisions.md",
]
SPDX-FileCopyrightText = ["2026 Dmitry Togulev", "2026 Алексей Штырняев"]
SPDX-License-Identifier = "CC-BY-NC-SA-4.0"

# The brand: the logos, the favicons and app icons made from them, and the
# start-screen photo.
[[annotations]]
path = [
  "apps/ui/src/assets/brand/**",
  "apps/ui/src/brand/*.svg",
  "apps/ui/src/assets/favicons/**",
  "apps/frontend/public/*.png",
  "apps/ui/src/assets/home/photo.jpg",
]
SPDX-FileCopyrightText = "2026 Dmitry Togulev"
SPDX-License-Identifier = "LicenseRef-AllRightsReserved"

